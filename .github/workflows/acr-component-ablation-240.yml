name: ACR-MCR Heldout Component Ablation 240 Runs
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: acr-ablation-original-240
  cancel-in-progress: false
jobs:
  run:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        scenario: [S0, S1, S2, S3, S4, S5]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/recovery_gate.py
      - name: Run original controller component ablations on untouched seed blocks
        run: |
          python recovery_generalisation/run_component_ablation.py \
            --scenario '${{ matrix.scenario }}' \
            --out 'ablation_${{ matrix.scenario }}.jsonl'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ablation-${{ matrix.scenario }}
          path: ablation_*.jsonl
          retention-days: 14
          if-no-files-found: warn
  infer:
    needs: run
    if: always() && needs.run.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: ablation-*
          path: collected_ablation
          merge-multiple: true
      - run: |
          python recovery_generalisation/analyze_component_ablation.py \
            --directory collected_ablation --out confirmed_component_ablation.json
      - uses: actions/upload-artifact@v4
        with:
          name: acr-120node-heldout-component-ablation-240
          path: confirmed_component_ablation.json
          retention-days: 21
